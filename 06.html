<!DOCTYPE HTML>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />


    <style>

      /* Post05 Typography Override    */


      body.post05 .post-body {
        line-height: 1.75;
        font-size: 16px; /* base */
        color: #222;
        max-width: 760px; /* 가독성 */
      }


      body.post05 .post-title {
        font-size: 34px;
        font-weight: 800;
        line-height: 1.25;
        letter-spacing: -0.3px;
        margin: 0 0 10px 0;
      }


      body.post05 .sub-title {
        font-size: 18px;
        color: #666;
        margin: 0 0 28px 0;
      }

      /* 섹션 제목(h3) */
      body.post05 .post-body h3 {
        font-size: 24px;
        font-weight: 800;
        margin: 42px 0 14px 0;
        letter-spacing: -0.2px;
      }

      /* 하위 제목(h4) */
      body.post05 .post-body h4 {
        font-size: 19px;
        font-weight: 700;
        margin: 28px 0 10px 0;
      }

      /* 본문 */
      body.post05 .post-body p {
        font-size: 15px;
        line-height: 1.85;
        margin: 0 0 16px 0;
        color: #333;
      }

      /* 리스트 */
      body.post05 .post-body ul,
      body.post05 .post-body ol {
        font-size: 15px;
        line-height: 1.85;
        margin: 0 0 18px 0;
        padding-left: 20px;
      }

      /* 구분선 */
      body.post05 .post-body hr {
        margin: 34px 0;
        opacity: 0.2;
      }

      @media (max-width: 600px) {
        body.post05 .post-title { font-size: 28px; }
        body.post05 .sub-title { font-size: 16px; }
        body.post05 .post-body h3 { font-size: 21px; }
        body.post05 .post-body h4 { font-size: 18px; }
        body.post05 .post-body p,
        body.post05 .post-body ul,
        body.post05 .post-body ol { font-size: 14.5px; }
      }
    </style>
  </head>
